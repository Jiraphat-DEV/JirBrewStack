name: Build and Deploy to Firebase (Hosting + Firestore Rules)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - uat
          - prod
        default: uat

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ENV: ${{ vars.VITE_ENV }}

      - name: Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          # ลบไฟล์ credential ทิ้งไม่ว่า deploy จะจบแบบไหน กัน credential ค้างบน self-hosted runner
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT

          # prod ถูกเปิดค้างไว้ตั้งใจโดยที่ secret ยังว่าง (ดู Global Constraint ในแผนงาน)
          # ถ้าเลือก prod ตอนนี้ต้องล้มด้วยข้อความที่อ่านออก ไม่ใช่ไปพังลึกใน ADC parsing ของ firebase-tools
          if [ ! -s "$RUNNER_TEMP/sa.json" ]; then
            echo "::error::secrets.FIREBASE_SERVICE_ACCOUNT is empty for environment '$TARGET_ENVIRONMENT'. Set this secret in the '$TARGET_ENVIRONMENT' GitHub environment before dispatching this workflow against it." >&2
            exit 1
          fi

          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          bunx firebase-tools@15 deploy \
            --only firestore,hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
